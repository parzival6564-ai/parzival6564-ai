name: Contribution snake

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # once a day
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Scrapes github.com/users/<owner>/contributions, renders both themes and
      # fails (publishing nothing) if any cell differs from the live calendar.
      - name: Render snake from the live contribution calendar
        run: node scripts/contrib-snake.mjs "${{ github.repository_owner }}" dist

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
